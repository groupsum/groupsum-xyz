apiVersion: npmctl.com/v1
schemaVersion: 2

proxy_hosts:
  - domain_names:
      - "groupsum.xyz.localhost"
      - "www.groupsum.xyz.localhost"
    forward_scheme: http
    forward_host: groupsum-xyz
    forward_port: 80
    ssl_forced: 0
    http2_support: 0
    hsts_enabled: 0
    hsts_subdomains: 0
    allow_websocket_upgrade: 1
    block_exploits: 1
    meta:
      managed_by: npmctl
      owner: groupsum-xyz
      resource_id: proxy.groupsum-xyz.development
