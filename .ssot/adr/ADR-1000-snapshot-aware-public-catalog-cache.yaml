summary: "Govern feat:catalog.snapshot-cache. Freeze shared public read models into the digest-checked source before snapshot finalization. Key caches by snapshot, projection version, route, filters and page; never label mutable rows immutable. Generate populated static details from those models. Use bounded public-only memory and IndexedDB caches, short-lived current-pointer revalidation, stable validators, and anonymous shared proxy caching. Exclude credentials, cookies, writes, health and failures. Verify isolation, 304 responses, warm visits, persistence, freshness transitions, SSR parity and responsive budgets. See docs/catalog-caching.md for the complete decision, contracts, rollout and evidence requirements. No deployment certification is implied."
