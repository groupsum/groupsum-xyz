services:
  groupsum-postgres:
    image: postgres:17-alpine
    container_name: groupsum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: groupsum
      POSTGRES_USER: groupsum
      POSTGRES_PASSWORD: ${GROUPSUM_POSTGRES_PASSWORD:-groupsum}
    volumes:
      - groupsum-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupsum -d groupsum"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - dockerwp

  groupsum-duckdb:
    image: duckdb/duckdb:1.5.4
    container_name: groupsum-duckdb
    restart: unless-stopped
    entrypoint: ["/duckdb"]
    command:
      - /analytics/groupsum-metrics.duckdb
      - -light-mode
      - -cmd
      - .output /dev/null
      - -cmd
      - >-
        INSTALL quack; LOAD quack;
        CALL quack_serve('quack:0.0.0.0:9494',
        token => getenv('GROUPSUM_DUCKDB_TOKEN'),
        allow_other_hostname => true, disable_ssl => true);
    environment:
      GROUPSUM_DUCKDB_TOKEN: ${GROUPSUM_DUCKDB_TOKEN:-groupsum-local-token}
    volumes:
      - groupsum-duckdb-data:/analytics
    stdin_open: true
    tty: true
    expose:
      - "9494"
    healthcheck:
      test:
        - CMD
        - /duckdb
        - -c
        - >-
          LOAD quack;
          FROM quack_query('quack:localhost:9494', 'SELECT 1',
          token => getenv('GROUPSUM_DUCKDB_TOKEN'), disable_ssl => true);
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - dockerwp

  groupsum-catalog-api:
    build:
      context: .
      dockerfile: pkgs/backend/Dockerfile
    container_name: groupsum-catalog-api
    restart: unless-stopped
    environment:
      GROUPSUM_DATABASE_URL: postgresql+psycopg://groupsum:${GROUPSUM_POSTGRES_PASSWORD:-groupsum}@groupsum-postgres:5432/groupsum
      GROUPSUM_ANALYTICS_DSN: quack://groupsum-duckdb:9494
      GROUPSUM_ANALYTICS_TOKEN: ${GROUPSUM_DUCKDB_TOKEN:-groupsum-local-token}
      GROUPSUM_ANALYTICS_DISABLE_SSL: "true"
      GROUPSUM_PUBLIC_BASE_URL: https://groupsum.xyz
    depends_on:
      groupsum-postgres:
        condition: service_healthy
      groupsum-duckdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      start_period: 20m
      interval: 10s
      timeout: 5s
      retries: 60
    networks:
      dockerwp:
        aliases:
          - groupsum-catalog-api

  groupsum-xyz:
    build:
      context: .
      dockerfile: pkgs/frontend/Dockerfile
    container_name: groupsum-xyz
    restart: unless-stopped
    labels:
      site.host: groupsum.xyz
      site.kind: mdwrk-lander
    ports:
      - "8082:80"
    depends_on:
      groupsum-catalog-api:
        condition: service_healthy
    networks:
      dockerwp:
        aliases:
          - groupsum-xyz

networks:
  dockerwp:
    name: dockerwp
    external: true

volumes:
  groupsum-postgres-data:
    name: groupsum-xyz-postgres-data
  groupsum-duckdb-data:
    name: groupsum-xyz-duckdb-data
