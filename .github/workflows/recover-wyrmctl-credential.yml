name: Recover wyrmctl credential

on:
  workflow_dispatch:
    inputs:
      recipient_public_key_b64:
        description: Ephemeral RSA public key in base64-encoded DER form
        required: true
        type: string
      confirmation:
        description: Type RECOVER-WYRMCTL-CREDENTIAL to authorize this one-time recovery
        required: true
        type: string

permissions:
  contents: read

jobs:
  recover:
    if: ${{ inputs.confirmation == 'RECOVER-WYRMCTL-CREDENTIAL' }}
    runs-on:
      group: portwyrm-deployment
      labels: [self-hosted, Linux, X64, vm102]
    steps:
      - name: Encrypt the existing VM102 credential
        shell: bash
        env:
          RECIPIENT_PUBLIC_KEY_B64: ${{ inputs.recipient_public_key_b64 }}
        run: |
          set -euo pipefail
          umask 077
          environment_file=/etc/groupsum/portwyrm.env
          test -r "$environment_file"
          public_key_file="$(mktemp)"
          ciphertext_file="${RUNNER_TEMP}/wyrmctl-secret.enc"
          cleanup() {
            rm -f -- "$public_key_file"
          }
          trap cleanup EXIT
          printf '%s' "$RECIPIENT_PUBLIC_KEY_B64" | base64 --decode > "$public_key_file"
          secret_b64="$(sed -n 's/^PORTWYRM_WYRMCTL_SECRET_B64=//p' "$environment_file" | tail -n 1)"
          test -n "$secret_b64"
          printf '%s' "$secret_b64" \
            | base64 --decode \
            | openssl pkeyutl -encrypt \
                -pubin \
                -keyform DER \
                -inkey "$public_key_file" \
                -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256 \
                -out "$ciphertext_file"
          test -s "$ciphertext_file"
          unset secret_b64

      - name: Upload encrypted recovery payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wyrmctl-credential-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/wyrmctl-secret.enc
          if-no-files-found: error
          retention-days: 1
