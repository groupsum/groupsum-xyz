name: Deploy

on:
  workflow_call:
    inputs:
      snapshot_id:
        description: Finalized API snapshot used to rebuild the public static catalog
        required: false
        type: string
      bootstrap_catalog:
        description: One-time rollout mode that collects and publishes the first API-backed snapshot
        required: false
        default: false
        type: boolean
      repair_certificate_ownership:
        description: Adopt a compatible unmanaged certificate before planning
        required: false
        default: false
        type: boolean
    secrets:
      WYRMCTL_BASE_URL:
        description: Portwyrm API URL used by short-lived wyrmctl planning
        required: false
      WYRMCTL_IDENTITY:
        description: Portwyrm automation identity used by short-lived wyrmctl planning
        required: false
      WYRMCTL_SECRET:
        description: Portwyrm automation secret used by short-lived wyrmctl planning
        required: false
      PORTWYRM_ADMIN_PASSWORD:
        description: Canonical VM102 Portwyrm automation password
        required: false
      GROUPSUM_CATALOG_INTERNAL_TOKEN:
        description: Legacy catalog publisher token retained during key migration
        required: false
      GROUPSUM_CATALOG_PUBLISH_API_KEY:
        description: API key accepted from remote catalog publishers
        required: false
      GROUPSUM_DEPLOY_GITHUB_TOKEN:
        description: Token used by the backend to dispatch snapshot deployments
        required: false
      GROUPSUM_POSTGRES_PASSWORD:
        description: Production PostgreSQL password supplied by the deployment environment
        required: false
      GROUPSUM_DUCKDB_TOKEN:
        description: Production analytics token supplied by the deployment environment
        required: false
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: Finalized API snapshot used to rebuild the public static catalog
        required: false
        type: string
      bootstrap_catalog:
        description: One-time rollout mode that collects and publishes the first API-backed snapshot
        required: false
        default: false
        type: boolean
      repair_certificate_ownership:
        description: Adopt a compatible unmanaged certificate before planning
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-groupsum-xyz
  cancel-in-progress: false

env:
  COMPOSE_FILE: docker-compose.yaml
  COMPOSE_PROJECT: groupsum-xyz
  PUBLIC_HOST: groupsum.xyz
  PORTWYRM_NETWORK: portwyrm-edge
  PORTWYRM_CERT_PATH: /mnt/data/portwyrm/certificates
  DESIRED_STATE: .wyrmctl/desired-state/production/desired-state.yaml

jobs:
  repair-certificate-ownership:
    if: ${{ inputs.repair_certificate_ownership }}
    runs-on:
      group: portwyrm-deployment
      labels: [self-hosted, Linux, X64, vm102]
    environment: deployment
    env:
      WYRMCTL_BASE_URL: ${{ vars.WYRMCTL_BASE_URL || secrets.WYRMCTL_BASE_URL || secrets.NPM_BASE_URL }}
      WYRMCTL_IDENTITY: ${{ vars.WYRMCTL_IDENTITY || secrets.WYRMCTL_IDENTITY || secrets.NPM_IDENTITY }}
      WYRMCTL_SECRET: ${{ secrets.WYRMCTL_SECRET || secrets.PORTWYRM_ADMIN_PASSWORD || secrets.NPM_SECRET || secrets.NPM_PASSWORD || secrets.NGINX_PROXY_MANAGER_SECRET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v5
      - uses: cobycloud/actions/actions/wyrmctl-setup@4733b1d73417b6ce5f43c8993675225ba395aeee
      - name: Adopt compatible certificate ownership metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WYRMCTL_BASE_URL"
          test -n "$WYRMCTL_IDENTITY"
          test -n "$WYRMCTL_SECRET"
          echo "::add-mask::$WYRMCTL_SECRET"
          NPM_BASE_URL="$WYRMCTL_BASE_URL" NPM_IDENTITY="$WYRMCTL_IDENTITY" NPM_SECRET="$WYRMCTL_SECRET" \
            wyrmctl --output json adopt "$DESIRED_STATE" \
              --owner groupsum-xyz \
              --metadata-only \
              --only certificates \
              --certificate-mode reuse \
              --validate-output

  plan:
    needs: repair-certificate-ownership
    if: ${{ always() && (needs.repair-certificate-ownership.result == 'success' || needs.repair-certificate-ownership.result == 'skipped') }}
    runs-on:
      group: shortlived
      labels: [self-hosted, Linux, X64, sad-lewin, shortlived]
    environment: deployment
    env:
      WYRMCTL_BASE_URL: ${{ vars.WYRMCTL_BASE_URL || secrets.WYRMCTL_BASE_URL || secrets.NPM_BASE_URL }}
      WYRMCTL_IDENTITY: ${{ vars.WYRMCTL_IDENTITY || secrets.WYRMCTL_IDENTITY || secrets.NPM_IDENTITY }}
      WYRMCTL_SECRET: ${{ secrets.WYRMCTL_SECRET || secrets.PORTWYRM_ADMIN_PASSWORD || secrets.NPM_SECRET || secrets.NPM_PASSWORD || secrets.NGINX_PROXY_MANAGER_SECRET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v5
      - name: Validate catalog deployment input
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.snapshot_id }}" && "${{ inputs.bootstrap_catalog }}" == "true" ]]; then
            echo "Provide snapshot_id or bootstrap_catalog, not both" >&2
            exit 1
          fi
          if [[ -z "${{ inputs.snapshot_id }}" && "${{ inputs.bootstrap_catalog }}" != "true" ]]; then
            echo "A snapshot_id is required unless bootstrap_catalog is enabled" >&2
            exit 1
          fi
      - uses: cobycloud/actions/actions/wyrmctl-setup@4733b1d73417b6ce5f43c8993675225ba395aeee
      - name: Validate protected Portwyrm automation identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WYRMCTL_BASE_URL"
          test -n "$WYRMCTL_IDENTITY"
          test -n "$WYRMCTL_SECRET"
          echo "::add-mask::$WYRMCTL_SECRET"
          mkdir -p deployment-evidence
      - uses: cobycloud/actions/actions/wyrmctl-plan@56c4a13434c7ec49453bf109d7d6955158992b5a
        with:
          desired-state: ${{ env.DESIRED_STATE }}
          owner: groupsum-xyz
          artifact-out: deployment-evidence/wyrmctl-plan.json
          repository: ${{ github.repository }}
          environment: production
          commit: ${{ github.sha }}
          base-url: ${{ env.WYRMCTL_BASE_URL }}
          identity: ${{ env.WYRMCTL_IDENTITY }}
          secret: ${{ env.WYRMCTL_SECRET }}
          certificate-mode: create
      - name: Seal reviewed plan
        shell: bash
        run: sha256sum deployment-evidence/wyrmctl-plan.json > deployment-evidence/plan.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-plan-${{ github.sha }}
          path: deployment-evidence
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: plan
    runs-on:
      group: portwyrm-deployment
      labels: [self-hosted, Linux, X64, vm102]
    environment: deployment
    env:
      GROUPSUM_POSTGRES_PASSWORD: ${{ secrets.GROUPSUM_POSTGRES_PASSWORD }}
      GROUPSUM_DUCKDB_TOKEN: ${{ secrets.GROUPSUM_DUCKDB_TOKEN }}
      GROUPSUM_CATALOG_INTERNAL_TOKEN: ${{ secrets.GROUPSUM_CATALOG_INTERNAL_TOKEN }}
      GROUPSUM_CATALOG_PUBLISH_API_KEY: ${{ secrets.GROUPSUM_CATALOG_PUBLISH_API_KEY || secrets.GROUPSUM_CATALOG_INTERNAL_TOKEN }}
      GROUPSUM_DEPLOY_GITHUB_TOKEN: ${{ secrets.GROUPSUM_DEPLOY_GITHUB_TOKEN }}
      WYRMCTL_BASE_URL: ${{ vars.WYRMCTL_BASE_URL || secrets.WYRMCTL_BASE_URL || secrets.NPM_BASE_URL }}
      WYRMCTL_IDENTITY: ${{ vars.WYRMCTL_IDENTITY || secrets.WYRMCTL_IDENTITY || secrets.NPM_IDENTITY }}
      WYRMCTL_SECRET: ${{ secrets.WYRMCTL_SECRET || secrets.PORTWYRM_ADMIN_PASSWORD || secrets.NPM_SECRET || secrets.NPM_PASSWORD || secrets.NGINX_PROXY_MANAGER_SECRET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v5
      - uses: cobycloud/actions/actions/wyrmctl-setup@4733b1d73417b6ce5f43c8993675225ba395aeee
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployment-plan-${{ github.sha }}
          path: deployment-evidence
      - name: Validate VM102 deployment topology
        shell: bash
        run: |
          set -euo pipefail
          docker inspect portwyrm-portwyrm-1 >/dev/null
          docker network inspect "$PORTWYRM_NETWORK" >/dev/null
          test -d "$PORTWYRM_CERT_PATH"
      - name: Verify reviewed plan and protected automation identity
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check deployment-evidence/plan.sha256
          test -n "$WYRMCTL_BASE_URL"
          test -n "$WYRMCTL_IDENTITY"
          test -n "$WYRMCTL_SECRET"
          echo "::add-mask::$WYRMCTL_SECRET"
      - name: Validate production secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GROUPSUM_POSTGRES_PASSWORD"
          test -n "$GROUPSUM_DUCKDB_TOKEN"
          test -n "$GROUPSUM_CATALOG_PUBLISH_API_KEY"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Materialize finalized snapshot from the catalog API
        if: ${{ inputs.snapshot_id != '' }}
        env:
          GROUPSUM_CATALOG_API_URL: https://groupsum.xyz
        run: npm run catalog:materialize -- --snapshot-id "${{ inputs.snapshot_id }}"
      - run: npm ci
      - name: Collect the one-time bootstrap catalog
        if: ${{ inputs.bootstrap_catalog }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run catalog:collect
      - name: Compile and validate the bootstrap catalog
        if: ${{ inputs.bootstrap_catalog }}
        run: |
          npm run catalog:render
          npm run catalog:validate
      - run: npm run build:content
      - run: npm run build:insights
      - run: node pkgs/catalog-pipeline/export-editorial-records.mjs
      - run: python -m pip install uv==0.11.28
      - run: uv sync --locked --all-groups
        working-directory: pkgs/backend
      - name: Rebuild deterministic catalog datasets
        if: ${{ inputs.snapshot_id != '' || inputs.bootstrap_catalog }}
        run: |
          npm run catalog:render
          npm run catalog:export-public
      - run: uv run --locked pytest -q
        working-directory: pkgs/backend
      - run: uv run --locked python scripts/export_openapi.py
        working-directory: pkgs/backend
      - run: uv run --locked python scripts/validate_openapi_contract.py
        working-directory: pkgs/backend
      - run: npm run generate:api-client
      - name: Verify generated contracts are current
        run: git diff --exit-code -- pkgs/backend/openapi.json pkgs/frontend/src/api/catalog.generated.ts pkgs/frontend/src/api/schema.generated.ts pkgs/frontend/src/api/contract.generated.ts
      - run: npm run check
      - run: npm run build
      - run: npm run proxy:target-check
      - name: Build production images
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE_FILE" config --quiet
          docker compose -f "$COMPOSE_FILE" pull groupsum-postgres
          docker compose -f "$COMPOSE_FILE" build groupsum-duckdb groupsum-catalog-api groupsum-xyz
      - name: Acquire VM102 mutation lease
        id: host-lock
        uses: cobycloud/actions/actions/host-mutation-lock@56c4a13434c7ec49453bf109d7d6955158992b5a
        with:
          operation: acquire
          lock-name: vm102
      - name: Prepare production data disk
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh \
            --volume /mnt/data:/mnt/data \
            postgres:17-alpine \
            -c 'install -d -m 0750 -o 999 -g 999 /mnt/data/groupsum-xyz/postgres && install -d -m 0750 /mnt/data/groupsum-xyz/duckdb'
      - id: deploy-stack
        continue-on-error: true
        uses: cobycloud/actions/actions/docker-compose-stack@56c4a13434c7ec49453bf109d7d6955158992b5a
        with:
          compose-file: ${{ env.COMPOSE_FILE }}
          project-name: ${{ env.COMPOSE_PROJECT }}
          operation: deploy
      - name: Capture failed service health evidence
        if: steps.deploy-stack.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          for container in groupsum-postgres groupsum-duckdb groupsum-catalog-api groupsum-xyz; do
            echo "===== ${container}: health ====="
            docker inspect --format '{{json .State.Health}}' "$container" || true
            echo "===== ${container}: logs ====="
            docker logs --tail 200 "$container" || true
          done
          exit 1
      - name: Wait for application services
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            database="$(docker inspect --format '{{.State.Health.Status}}' groupsum-postgres 2>/dev/null || true)"
            analytics="$(docker inspect --format '{{.State.Health.Status}}' groupsum-duckdb 2>/dev/null || true)"
            api="$(docker inspect --format '{{.State.Health.Status}}' groupsum-catalog-api 2>/dev/null || true)"
            if [[ "$database" == healthy && "$analytics" == healthy && "$api" == healthy ]]; then break; fi
            sleep 5
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' groupsum-postgres)" = healthy
          test "$(docker inspect --format '{{.State.Health.Status}}' groupsum-duckdb)" = healthy
          test "$(docker inspect --format '{{.State.Health.Status}}' groupsum-catalog-api)" = healthy
          test "$(docker inspect --format '{{.State.Status}}' groupsum-xyz)" = running
          docker inspect --format '{{range $network, $_ := .NetworkSettings.Networks}}{{$network}}{{"\n"}}{{end}}' groupsum-xyz \
            | grep -Fxq "$PORTWYRM_NETWORK"
          docker exec groupsum-xyz wget -qO- http://127.0.0.1/ >/dev/null
      - name: Publish the bootstrap snapshot into the new API
        if: ${{ inputs.bootstrap_catalog }}
        run: |
          docker exec \
            -e GROUPSUM_CATALOG_API_URL=http://127.0.0.1:8000 \
            -e GROUPSUM_DEPLOY_GITHUB_TOKEN= \
            groupsum-catalog-api \
            python /app/pkgs/backend/scripts/publish_catalog.py
      - uses: cobycloud/actions/actions/wyrmctl-apply@56c4a13434c7ec49453bf109d7d6955158992b5a
        with:
          artifact: deployment-evidence/wyrmctl-plan.json
          repository: ${{ github.repository }}
          environment: production
          commit: ${{ github.sha }}
          base-url: ${{ env.WYRMCTL_BASE_URL }}
          identity: ${{ env.WYRMCTL_IDENTITY }}
          secret: ${{ env.WYRMCTL_SECRET }}
          report: deployment-evidence/wyrmctl-apply.json
          audit-log: deployment-evidence/wyrmctl-audit.json
          rollback-plan: deployment-evidence/wyrmctl-rollback.json
      - name: Verify edge certificate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if openssl s_client -connect "$PUBLIC_HOST:443" -servername "$PUBLIC_HOST" </dev/null 2>/dev/null \
                | openssl x509 -noout -ext subjectAltName | grep -Fq "DNS:$PUBLIC_HOST"; then exit 0; fi
            sleep 5
          done
          exit 1
      - if: always()
        uses: cobycloud/actions/actions/docker-compose-stack@56c4a13434c7ec49453bf109d7d6955158992b5a
        with:
          compose-file: ${{ env.COMPOSE_FILE }}
          project-name: ${{ env.COMPOSE_PROJECT }}
          operation: logs
          logs-output: production-stack.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-deploy-${{ github.sha }}
          path: |
            deployment-evidence
            production-stack.log
          if-no-files-found: warn
          retention-days: 14
      - name: Release VM102 mutation lease
        if: ${{ always() && steps.host-lock.outcome == 'success' }}
        uses: cobycloud/actions/actions/host-mutation-lock@56c4a13434c7ec49453bf109d7d6955158992b5a
        with:
          operation: release
          lock-name: vm102

  verify-public:
    needs: deploy
    runs-on:
      group: shortlived
      labels: [self-hosted, Linux, X64, sad-lewin, shortlived]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
      - name: Verify public catalog and rendered page markers
        env:
          DEPLOY_VERIFY_URL: https://groupsum.xyz
        run: node pkgs/frontend/scripts/verify-deployment.mjs
