name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-groupsum-xyz
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: deployment
    environment: deployment
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate Docker proxy target
        run: npm run proxy:target-check
      - name: Build site image
        run: docker-compose -f docker-compose.yaml build groupsum-xyz
      - name: Restart site container
        run: |
          docker-compose -f docker-compose.yaml stop groupsum-xyz || true
          docker-compose -f docker-compose.yaml rm -f groupsum-xyz || true
          docker rm -f groupsum-xyz || true
          docker-compose -f docker-compose.yaml up -d --no-build --force-recreate --no-deps groupsum-xyz
