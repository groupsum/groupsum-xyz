name: Deploy

on:
  workflow_dispatch:
    inputs:
      catalog_run_id:
        description: Successful catalog workflow run containing the immutable snapshot artifact
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-groupsum-xyz
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: deployment
    environment: deployment
    env:
      GROUPSUM_CATALOG_INTERNAL_TOKEN: ${{ secrets.GROUPSUM_CATALOG_INTERNAL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve catalog snapshot artifact
        id: catalog
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.catalog_run_id }}
        run: |
          run_id="$REQUESTED_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --workflow catalog.yml --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          if [ -z "$run_id" ]; then
            echo "No successful catalog refresh artifact is available." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Materialize finalized catalog snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-catalog-snapshot
          path: catalog/generated
          github-token: ${{ github.token }}
          run-id: ${{ steps.catalog.outputs.run_id }}
      - name: Reclaim disposable Docker build space
        run: |
          docker system prune --all --force
          docker system df
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:content
      - run: npm run build:insights
      - run: node pkgs/catalog-pipeline/export-editorial-records.mjs
      - run: python -m pip install uv==0.11.28
      - run: uv sync --locked --all-groups
        working-directory: pkgs/backend
      - run: uv run --locked pytest -q
        working-directory: pkgs/backend
      - run: uv run --locked python scripts/export_openapi.py
        working-directory: pkgs/backend
      - run: uv run --locked python scripts/validate_openapi_contract.py
        working-directory: pkgs/backend
      - run: npm run generate:api-client
      - name: Verify generated contracts are current
        run: git diff --exit-code -- catalog/content/records.json pkgs/backend/openapi.json pkgs/frontend/src/api/catalog.generated.ts pkgs/frontend/src/api/schema.generated.ts pkgs/frontend/src/api/contract.generated.ts
      - run: npm run check
      - run: npm run build
      - name: Validate Docker proxy target
        run: npm run proxy:target-check
      - name: Build site and catalog API images
        run: |
          docker compose version
          docker compose -f docker-compose.yaml pull groupsum-duckdb
          docker compose -f docker-compose.yaml build groupsum-catalog-api
          docker compose -f docker-compose.yaml build groupsum-xyz
      - name: Replace site and catalog API containers
        run: |
          docker compose -f docker-compose.yaml up -d --no-build \
            groupsum-postgres groupsum-duckdb groupsum-catalog-api groupsum-xyz || {
            docker compose -f docker-compose.yaml ps
            docker compose -f docker-compose.yaml logs --tail=200 groupsum-postgres groupsum-catalog-api groupsum-duckdb groupsum-xyz
            exit 1
          }
      - name: Verify public catalog and rendered page markers
        env:
          DEPLOY_VERIFY_URL: https://groupsum.xyz
        run: npm run verify:deployment
