name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-groupsum-xyz
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: deployment
    environment: deployment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate Docker proxy target
        run: npm run proxy:target-check
      - name: Build site image
        run: docker-compose -f docker-compose.yaml build groupsum-xyz
      - name: Restart site container
        run: |
          docker-compose -f docker-compose.yaml stop groupsum-xyz || true
          docker-compose -f docker-compose.yaml rm -f groupsum-xyz || true
          docker rm -f groupsum-xyz || true
          docker-compose -f docker-compose.yaml up -d --no-build --force-recreate --no-deps groupsum-xyz
