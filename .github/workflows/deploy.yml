name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-groupsum-xyz
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: deployment
    environment: deployment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:content
      - run: npm run build:insights
      - run: node scripts/export-editorial-records.mjs
      - run: python -m pip install uv==0.11.28
      - run: uv sync --locked --all-groups
        working-directory: backend
      - run: uv run --locked pytest -q
        working-directory: backend
      - run: uv run --locked python scripts/export_openapi.py
        working-directory: backend
      - run: uv run --locked python scripts/export_page_models.py
        working-directory: backend
      - run: npm run generate:api-client
      - name: Verify generated contracts are current
        run: git diff --exit-code -- catalog/content/records.json backend/openapi.json src/api/catalog.generated.ts
      - run: npm run check
      - run: npm run build
      - name: Validate Docker proxy target
        run: npm run proxy:target-check
      - name: Build site and catalog API images
        run: |
          docker-compose -f docker-compose.yaml build groupsum-catalog-api
          docker-compose -f docker-compose.yaml build groupsum-duckdb
          docker-compose -f docker-compose.yaml build groupsum-xyz
      - name: Replace site and catalog API containers
        run: |
          docker-compose -f docker-compose.yaml down --remove-orphans
          docker-compose -f docker-compose.yaml up -d --no-build groupsum-postgres groupsum-catalog-api groupsum-duckdb groupsum-xyz || {
            docker-compose -f docker-compose.yaml ps
            docker-compose -f docker-compose.yaml logs --tail=200 groupsum-postgres groupsum-catalog-api groupsum-duckdb groupsum-xyz
            exit 1
          }
      - name: Verify public catalog and rendered page markers
        env:
          DEPLOY_VERIFY_URL: https://groupsum.xyz
        run: npm run verify:deployment
