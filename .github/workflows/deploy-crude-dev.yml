name: Deploy crude.dev

on:
  workflow_dispatch:
    inputs:
      crude_ref:
        description: Commit or branch from groupsum/crude-dev
        required: true
        default: master
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-crude-dev-production
  cancel-in-progress: false

env:
  NPMCTL_OWNER: crude-dev
  NPM_BASE_URL: ${{ secrets.NPM_BASE_URL }}
  NPM_IDENTITY: ${{ secrets.NPM_IDENTITY }}
  NPM_SECRET: ${{ secrets.NPM_SECRET || secrets.NPM_PASSWORD }}
  NPM_TIMEOUT_S: "30"
  NAMECHEAP_API_USER: ${{ secrets.NAMECHEAP_API_USER }}
  NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
  NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
  NAMECHEAP_CLIENT_IP: ${{ secrets.NAMECHEAP_CLIENT_IP }}
  SITE_SERVER_IP: ${{ secrets.SITE_SERVER_IP }}
  CRUDE_DEV_POSTGRES_PASSWORD: ${{ secrets.CRUDE_DEV_POSTGRES_PASSWORD }}
  UNUI_BOOTSTRAP_SUPERUSER_PASSWORD: ${{ secrets.CRUDE_DEV_BOOTSTRAP_SUPERUSER_PASSWORD }}

jobs:
  deploy:
    name: Deploy workload and apply npmctl state
    runs-on: deployment
    environment: deployment
    steps:
      - name: Check out crude-dev deployment SSOT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: groupsum/crude-dev
          ref: ${{ inputs.crude_ref }}
          ssh-key: ${{ secrets.CRUDE_DEV_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Check required configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in NPM_BASE_URL NPM_IDENTITY NPM_SECRET NAMECHEAP_API_USER NAMECHEAP_API_KEY NAMECHEAP_USERNAME NAMECHEAP_CLIENT_IP SITE_SERVER_IP CRUDE_DEV_POSTGRES_PASSWORD UNUI_BOOTSTRAP_SUPERUSER_PASSWORD; do
            test -n "$(printenv "$name")" || { echo "Missing $name" >&2; exit 1; }
          done
          test "${{ vars.NPMCTL_SHARED_LOCK_CONFIRMED }}" = "true" || {
            echo "NPMCTL_SHARED_LOCK_CONFIRMED must remain true for the shared Namecheap lock." >&2
            exit 1
          }

      - name: Install latest npmctl toolchain from PyPI without cache
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/crude-dev-npmctl-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --no-cache-dir --upgrade npmctl npmctl-namecheap
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Run provider diagnostics
        run: |
          npmctl --version
          npmctl plugins list
          npmctl doctor
          npmctl dns doctor --provider namecheap

      - name: Prepare persistent storage and runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0750 /mnt/data/crude-dev/postgres /mnt/data/crude-dev/analytics
          sudo chown 70:70 /mnt/data/crude-dev/postgres
          umask 077
          {
            echo "UNUI_IMAGE_TAG=3c426cdfe4422a4510161990ede109717180cd32"
            echo "CRUDE_DEV_PUBLIC_ORIGIN=https://crude.dev"
            echo "CRUDE_DEV_PUBLIC_API_URL=https://api.crude.dev"
            echo "CRUDE_DEV_PUBLIC_WS_URL=wss://api.crude.dev/ws/realtime"
            printf 'CRUDE_DEV_POSTGRES_PASSWORD=%s\n' "$CRUDE_DEV_POSTGRES_PASSWORD"
            echo "UNUI_BOOTSTRAP_SUPERUSER_NAME=Superuser"
            echo "UNUI_BOOTSTRAP_SUPERUSER=superuser"
            echo "UNUI_BOOTSTRAP_SUPERUSER_EMAIL=superuser@crude.dev"
            printf 'UNUI_BOOTSTRAP_SUPERUSER_PASSWORD=%s\n' "$UNUI_BOOTSTRAP_SUPERUSER_PASSWORD"
          } > .env

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy pinned UNUI containers
        run: |
          docker compose pull crude-dev-backend
          docker compose build --pull crude-dev
          docker compose up -d --remove-orphans
          docker compose ps

      - name: Verify container health and proxy targets
        shell: bash
        run: |
          set -euo pipefail
          for container in crude-dev-postgres crude-dev-backend crude-dev; do
            for attempt in $(seq 1 60); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
              test "$status" = "healthy" && break
              test "$status" != "unhealthy" || { docker logs "$container"; exit 1; }
              sleep 2
            done
            test "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")" = "healthy"
          done
          docker run --rm --network dockerwp curlimages/curl:8.15.0 --fail http://crude-dev:3000/api/health
          docker run --rm --network dockerwp curlimages/curl:8.15.0 --fail http://crude-dev-backend:8000/system/healthz

      - name: Render and plan production npmctl state
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/crude-dev-npmctl"
          mkdir -p "$artifact/desired-state" "$artifact/evidence/backup"
          for source in .npmctl/desired-state/production/*.yaml; do
            target="$artifact/desired-state/$(basename "$source")"
            sed -e "s|__SITE_SERVER_IP__|$SITE_SERVER_IP|g" -e "s|__LETSENCRYPT_EMAIL__|$NPM_IDENTITY|g" "$source" > "$target"
          done
          npmctl validate "$artifact/desired-state"
          npmctl --output json plan "$artifact/desired-state" --owner "$NPMCTL_OWNER" --validate-output > "$artifact/plan.json"

      - name: Apply production DNS, certificate, and proxy state
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/crude-dev-npmctl"
          export artifact
          flock -w 1800 /tmp/npmctl-namecheap-sethosts.lock bash -euo pipefail -c '
            npmctl --output json plan "$artifact/desired-state" --owner "$NPMCTL_OWNER" --validate-output > "$artifact/current-plan.json"
            diff --unified "$artifact/plan.json" "$artifact/current-plan.json"
            npmctl apply "$artifact/desired-state" --owner "$NPMCTL_OWNER" --certificate-mode create \
              --backup-dir "$artifact/evidence/backup" \
              --report "$artifact/evidence/apply-report.json" \
              --rollback-plan "$artifact/evidence/rollback-plan.json" \
              --audit-log "$artifact/evidence/audit-log.json" \
              --validate-output
          '

      - name: Verify production endpoints
        shell: bash
        run: |
          set -euo pipefail
          for host in crude.dev www.crude.dev api.crude.dev; do
            for attempt in $(seq 1 30); do
              getent ahostsv4 "$host" | awk '{print $1}' | grep -Fx "$SITE_SERVER_IP" && break
              sleep 10
            done
            getent ahostsv4 "$host" | awk '{print $1}' | grep -Fx "$SITE_SERVER_IP"
          done
          curl --fail --retry 20 --retry-delay 5 --retry-all-errors https://crude.dev/
          curl --fail --retry 20 --retry-delay 5 --retry-all-errors https://www.crude.dev/
          curl --fail --retry 20 --retry-delay 5 --retry-all-errors https://api.crude.dev/system/healthz

      - name: Upload npmctl evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crude-dev-npmctl-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/crude-dev-npmctl/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove plaintext runtime file
        if: always()
        run: rm -f .env
