name: Inspect or repair catalog publishing proxy
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply only a reviewed Groupsum catalog-route proxy change
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-groupsum-xyz
  cancel-in-progress: false
env:
  DESIRED_STATE: .wyrmctl/desired-state/production/desired-state.yaml
jobs:
  inspect:
    runs-on:
      group: portwyrm-deployment
      labels: [self-hosted, Linux, X64, vm102]
    environment: deployment
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Read active Groupsum proxy limits and rejection evidence
        run: python3 scripts/catalog-proxy-diagnostics.py
  plan:
    needs: inspect
    if: inputs.apply && github.ref == 'refs/heads/master'
    runs-on:
      group: shortlived
      labels: [self-hosted, Linux, X64, sad-lewin, shortlived]
    environment: deployment
    env: &proxy-identity
      WYRMCTL_BASE_URL: ${{ vars.WYRMCTL_BASE_URL || secrets.WYRMCTL_BASE_URL || secrets.NPM_BASE_URL }}
      WYRMCTL_IDENTITY: ${{ vars.WYRMCTL_IDENTITY || secrets.WYRMCTL_IDENTITY || secrets.NPM_IDENTITY }}
      WYRMCTL_SECRET: ${{ secrets.WYRMCTL_SECRET || secrets.PORTWYRM_ADMIN_PASSWORD || secrets.NPM_SECRET || secrets.NPM_PASSWORD || secrets.NGINX_PROXY_MANAGER_SECRET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: cobycloud/actions/actions/wyrmctl-setup@4733b1d73417b6ce5f43c8993675225ba395aeee
      - uses: cobycloud/actions/actions/wyrmctl-plan@56c4a13434c7ec49453bf109d7d6955158992b5a
        with:
          desired-state: ${{ env.DESIRED_STATE }}
          owner: groupsum-xyz
          artifact-out: deployment-evidence/wyrmctl-plan.json
          repository: ${{ github.repository }}
          environment: production
          commit: ${{ github.sha }}
          base-url: ${{ env.WYRMCTL_BASE_URL }}
          identity: ${{ env.WYRMCTL_IDENTITY }}
          secret: ${{ env.WYRMCTL_SECRET }}
          certificate-mode: create
      - name: Reject unrelated changes and seal reviewed plan
        run: |
          python3 scripts/validate-catalog-proxy-plan.py deployment-evidence/wyrmctl-plan.json
          sha256sum deployment-evidence/wyrmctl-plan.json > deployment-evidence/plan.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: catalog-proxy-plan-${{ github.sha }}
          path: deployment-evidence
          retention-days: 14
  apply:
    needs: plan
    runs-on:
      group: portwyrm-deployment
      labels: [self-hosted, Linux, X64, vm102]
    environment: deployment
    env: *proxy-identity
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: cobycloud/actions/actions/wyrmctl-setup@4733b1d73417b6ce5f43c8993675225ba395aeee
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: catalog-proxy-plan-${{ github.sha }}
          path: deployment-evidence
      - run: |
          sha256sum --check deployment-evidence/plan.sha256
          python3 scripts/validate-catalog-proxy-plan.py deployment-evidence/wyrmctl-plan.json
      - id: host-lock
        uses: cobycloud/actions/actions/host-mutation-lock@56c4a13434c7ec49453bf109d7d6955158992b5a
        with:
          operation: acquire
          lock-name: vm102
      - uses: cobycloud/actions/actions/wyrmctl-apply@56c4a13434c7ec49453bf109d7d6955158992b5a
        with:
          artifact: deployment-evidence/wyrmctl-plan.json
          repository: ${{ github.repository }}
          environment: production
          commit: ${{ github.sha }}
          base-url: ${{ env.WYRMCTL_BASE_URL }}
          identity: ${{ env.WYRMCTL_IDENTITY }}
          secret: ${{ env.WYRMCTL_SECRET }}
          report: deployment-evidence/wyrmctl-apply.json
          audit-log: deployment-evidence/wyrmctl-audit.json
          rollback-plan: deployment-evidence/wyrmctl-rollback.json
      - run: python3 scripts/catalog-proxy-diagnostics.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: catalog-proxy-apply-${{ github.sha }}
          path: deployment-evidence
          retention-days: 14
      - if: ${{ always() && steps.host-lock.outcome == 'success' }}
        uses: cobycloud/actions/actions/host-mutation-lock@56c4a13434c7ec49453bf109d7d6955158992b5a
        with:
          operation: release
          lock-name: vm102
