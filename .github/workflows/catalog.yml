name: Refresh public catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: groupsum-public-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Collect public catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run catalog:collect
      - name: Compile display-safe catalog datasets
        run: npm run catalog:render
      - run: npm run check
      - run: npm run build
      - name: Create or update catalog refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- catalog/generated pkgs/frontend/src/data/catalog.generated.ts; then
            echo "Catalog is current."
            exit 0
          fi
          branch="automation/public-catalog-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git checkout -B "$branch"
          git add catalog/generated pkgs/frontend/src/data/catalog.generated.ts
          git commit -m "Refresh public ecosystem catalog"
          git push --force-with-lease origin "$branch"
          gh pr view "$branch" --json url >/dev/null 2>&1 || gh pr create --base master --head "$branch" --title "Refresh public ecosystem catalog" --body "Automated refresh from GitHub, PyPI, npm, crates.io, and repository manifests. Validation and parser tests passed."
