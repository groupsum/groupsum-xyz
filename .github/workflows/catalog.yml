name: Refresh public catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  actions: write
  contents: read
  packages: read

concurrency:
  group: groupsum-public-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Collect public catalog
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GROUPSUM_CATALOG_GITHUB_TOKEN || github.token }}
        run: npm run catalog:collect
      - name: Compile display-safe catalog datasets
        run: npm run catalog:render
      - name: Install backend publisher
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --all-groups
        working-directory: pkgs/backend
      - name: Export the Tigrbl public projection for static generation
        run: npm run catalog:export-public
      - run: npm run check
      - run: npm run build
      - name: Publish records and finalize snapshot
        env:
          GROUPSUM_CATALOG_API_URL: ${{ vars.GROUPSUM_CATALOG_API_URL || 'https://groupsum.xyz' }}
          GROUPSUM_CATALOG_INTERNAL_TOKEN: ${{ secrets.GROUPSUM_CATALOG_INTERNAL_TOKEN }}
        run: npm run catalog:publish
      - name: Preserve the exact finalized catalog snapshot for deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-catalog-snapshot
          path: catalog/generated
          if-no-files-found: error
          retention-days: 14

  dispatch-deploy:
    needs: refresh
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy the finalized catalog snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref master -f catalog_run_id="${{ github.run_id }}"
