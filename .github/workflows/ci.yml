name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GROUPSUM_POSTGRES_PASSWORD: ci-validation-only
      GROUPSUM_DUCKDB_TOKEN: ci-validation-only
      GROUPSUM_CATALOG_INTERNAL_TOKEN: ci-validation-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Pin the finalized public catalog snapshot
        id: snapshot
        shell: python
        run: |
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://groupsum.xyz/api/v1/snapshots",
              headers={"Cache-Control": "no-cache", "User-Agent": "groupsum-ci"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              snapshots = json.load(response)
          current = next(
              (row for row in snapshots.get("snapshots", [])
               if row.get("is_current") and row.get("status") == "complete"),
              None,
          )
          if current is None:
              raise SystemExit("No finalized public catalog snapshot is available")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"snapshot_id={current['snapshot_id']}\n")
          print(f"Pinned catalog snapshot: {current['snapshot_id']}")
      - name: Materialize the immutable snapshot without recollecting GitHub
        env:
          CATALOG_SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot_id }}
        run: npm run catalog:materialize -- --snapshot-id "$CATALOG_SNAPSHOT_ID"
      - run: npm run catalog:render
      - run: npm run build:content
      - run: npm run build:insights
      - run: node pkgs/catalog-pipeline/export-editorial-records.mjs
      - run: python -m pip install uv==0.11.28
      - run: uv sync --locked --all-groups
        working-directory: pkgs/backend
      - name: Export the shared Tigrbl public projection
        run: npm run catalog:export-public
      - run: uv run --locked pytest -q
        working-directory: pkgs/backend
      - run: uv run --locked ruff check src tests scripts
        working-directory: pkgs/backend
      - run: uv run --locked python scripts/export_openapi.py
        working-directory: pkgs/backend
      - run: uv run --locked python scripts/validate_openapi_contract.py
        working-directory: pkgs/backend
      - run: npm run generate:api-client
      - name: Verify generated backend and frontend contracts are current
        run: git diff --exit-code -- catalog/content/records.json pkgs/backend/openapi.json pkgs/frontend/src/api/catalog.generated.ts pkgs/frontend/src/api/schema.generated.ts pkgs/frontend/src/api/contract.generated.ts
      - run: npm run check
      - run: npm run build
      - run: npm run lighthouse
      - name: Preserve Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lighthouse-${{ github.sha }}
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate Docker proxy target
        run: npm run proxy:target-check
      - run: docker compose build groupsum-catalog-api
      - run: docker compose build groupsum-duckdb
      - run: docker compose build groupsum-xyz
