name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:content
      - run: npm run build:insights
      - run: node scripts/export-editorial-records.mjs
      - run: python -m pip install uv==0.11.28
      - run: uv sync --locked --all-groups
        working-directory: backend
      - run: uv run --locked pytest -q
        working-directory: backend
      - run: uv run --locked ruff check src tests scripts
        working-directory: backend
      - run: uv run --locked python scripts/export_openapi.py
        working-directory: backend
      - run: uv run --locked python scripts/export_page_models.py
        working-directory: backend
      - run: npm run generate:api-client
      - name: Verify generated backend and frontend contracts are current
        run: git diff --exit-code -- catalog/content/records.json backend/openapi.json src/api/catalog.generated.ts
      - run: npm run check
      - run: npm run build
      - run: npm run lighthouse
      - name: Validate Docker proxy target
        run: npm run proxy:target-check
      - run: docker compose build groupsum-catalog-api
      - run: docker compose build groupsum-duckdb
      - run: docker compose build groupsum-xyz
