name: Transfer BucketWarden NPM secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    env:
      SOURCE_NPM_IDENTITY: ${{ secrets.NPM_IDENTITY }}
      SOURCE_NPM_SECRET: ${{ secrets.NPM_SECRET || secrets.NPM_PASSWORD }}
      TARGET_PUBLIC_KEY: CsQSqxVAmfDKA42l1Ogiyc7v9DK7xFgi+CiL4WLkEhQ=
      TARGET_KEY_ID: 3380204578043523366
    steps:
      - name: Verify approved source secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_NPM_IDENTITY"
          test -n "$SOURCE_NPM_SECRET"
      - name: Install sealed-box implementation
        run: python -m pip install --disable-pip-version-check --no-input pynacl==1.5.0
      - name: Seal secrets to BucketWarden Actions key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox

          box = SealedBox(PublicKey(base64.b64decode(os.environ["TARGET_PUBLIC_KEY"])))
          values = {
              "NPM_IDENTITY": os.environ["SOURCE_NPM_IDENTITY"],
              "NPM_SECRET": os.environ["SOURCE_NPM_SECRET"],
          }
          sealed = {
              "key_id": os.environ["TARGET_KEY_ID"],
              "secrets": {
                  name: base64.b64encode(box.encrypt(value.encode("utf-8"))).decode("ascii")
                  for name, value in values.items()
              },
          }
          target = Path("sealed-secrets.json")
          target.write_text(json.dumps(sealed), encoding="utf-8")
          target.chmod(0o600)
          PY
      - name: Upload sealed transfer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bucketwarden-npm-secrets-sealed
          path: sealed-secrets.json
          if-no-files-found: error
          retention-days: 1