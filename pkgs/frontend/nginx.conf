proxy_cache_path /var/cache/nginx/catalog levels=1:2 keys_zone=catalog_public:16m max_size=128m inactive=24h use_temp_path=off;
map "$http_authorization$http_cookie" $catalog_private { default 1; "" 0; }
map $request_method $catalog_non_get { default 1; GET 0; }
map $upstream_status $catalog_bad_status { default 1; 200 0; 304 0; }
map $uri $catalog_uncacheable {
  default 1;
  ~^/api/v1/(catalog(?:/|$)|contributors(?:/|$)|repository-metrics$|snapshots(?:/|$)|entities/|organizations(?:/|$)|products(?:/|$)|portfolio(?:/|$)|analytics/) 0;
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_proxied any;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  location ^~ /api/ {
    proxy_pass http://groupsum-catalog-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;
    proxy_set_header Accept-Encoding "";
    proxy_cache catalog_public;
    proxy_cache_key "$host$request_uri";
    proxy_cache_methods GET;
    proxy_cache_bypass $catalog_private $catalog_non_get $catalog_uncacheable;
    proxy_no_cache $catalog_private $catalog_non_get $catalog_uncacheable $catalog_bad_status $upstream_http_set_cookie;
    proxy_cache_valid 200 15s;
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    proxy_cache_background_update on;
    add_header X-Catalog-Proxy-Cache $upstream_cache_status always;
  }

  location ^~ /internal/ {
    client_max_body_size 32m;
    proxy_pass http://groupsum-catalog-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
  }

  location = /openapi.json {
    proxy_pass http://groupsum-catalog-api:8000/openapi.json;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    # Static route directories retain percent-encoded entity IDs for portable builds.
    try_files $uri $uri/ $request_uri $request_uri/ /index.html;
    add_header Cache-Control "public, max-age=60, stale-while-revalidate=30";
  }

  location ~* \.json$ {
    add_header Cache-Control "public, max-age=60, stale-while-revalidate=30";
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
    try_files $uri =404;
  }
}
