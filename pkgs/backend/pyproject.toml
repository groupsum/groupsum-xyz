[project]
name = "groupsum-catalog-api"
version = "0.1.0"
description = "Durable Tigrbl-backed catalog and resource API for groupsum.xyz"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tigrbl==0.4.5.dev4",
  "tigrbl-engine-duckdb==0.4.5.dev4",
  "tigrbl-engine-postgres==0.4.5.dev4",
  "tigrbl-engine-sqlite==0.4.5.dev4",
  "tigrcorn==0.3.17",
  "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groupsum_catalog_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/groupsum_catalog_api/tables/*.py" = ["F403", "F405"]
